spring:
  application:
    name: basin-evacuation-decision
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/basin_evacuation}
    username: ${DB_USERNAME:basin}
    password: ${DB_PASSWORD:basin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when_authorized

basin:
  outbox:
    batch-size: 50
