server:
  port: 8080

spring:
  application:
    name: basin-evacuation-decision
  datasource:
    url: jdbc:postgresql://localhost:5432/evacuation
    username: postgres
    password: postgres
  jpa:
    hibernate:
      # 只校验，不在启动时自动建表/改表；结构完全由 Flyway 管理
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 四级决策阈值（可按流域标定）
evacuation:
  threshold:
    rainfall:        # 3 小时累计降水，单位 mm
      red: 100.0
      orange: 50.0
      yellow: 25.0
    water:           # 河道水位，单位 m
      red: 6.0
      orange: 5.5
      yellow: 5.0
