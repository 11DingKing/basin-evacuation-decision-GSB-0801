spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/basin_evacuation_test
    username: basin
    password: basin
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
basin:
  outbox:
    batch-size: 10
    drain-delay-ms: 60000
